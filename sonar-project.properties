# SonarCloud configuration for jamilaj1/formula-ai-global
# -----------------------------------------------------------------------
# Run from repo root:
#   1) JS/TS tests + coverage (Cloudflare Worker):
#        npx vitest run --coverage      # writes coverage/lcov.info
#   2) Python tests + coverage (FastAPI backend):
#        cd backend && pytest --cov=. --cov-report=xml:../backend-coverage.xml
#   3) Push to SonarCloud:
#        npx sonar-scanner             # or the GitHub Action
#
# This file points Sonar at the right lcov.info / coverage.xml so the
# "Coverage" gauge stops showing "no conditions set".
# -----------------------------------------------------------------------

sonar.projectKey=jamilaj1_formula-ai-global
sonar.organization=jamilaj1
sonar.projectName=Formula AI Global
sonar.projectVersion=1.0

# What to analyse ------------------------------------------------------
# Keep source narrow — Sonar's "Maintainability A with 1.2k issues" is
# dominated by huge generated/vendored noise. Listing real source dirs
# only cuts that down dramatically.
sonar.sources=worker-src,backend/app,backend/services,backend/agents,backend/ml,backend/tools,backend/main.py,assets,scripts

# What to ignore -------------------------------------------------------
sonar.exclusions=\
  node_modules/**,\
  backend/venv/**,\
  backend/.venv/**,\
  worker.js,\
  worker.legacy-monolith.js,\
  sitemap.xml,\
  industries/**/*.html,\
  *.html,\
  *.patch,\
  _archive/**,\
  database/migrations/**,\
  DEPLOY_*.zip

# Tests ---------------------------------------------------------------
sonar.tests=tests,backend/tests,worker-src
sonar.test.inclusions=**/*.test.js,**/*.test.ts,**/test_*.py,**/*_test.py

# Coverage report paths -----------------------------------------------
# Vitest writes coverage/lcov.info next to the project root.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
# pytest --cov-report=xml writes coverage.xml (path from repo root).
sonar.python.coverage.reportPaths=backend-coverage.xml
sonar.python.version=3.11

# Code duplication is dominated by 40 industry landing pages sharing the
# same template (by design for SEO). Exclude them from duplication
# detection so the 35% number drops to its real value.
sonar.cpd.exclusions=industries/**/*.html,*.html

# Encoding ------------------------------------------------------------
sonar.sourceEncoding=UTF-8
